<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="theme-color" content="#f7fbff" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="随机数罗盘">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="application-name" content="随机数罗盘">
  <meta name="description" content="适合手机使用的随机数罗盘工具，支持结果记录、统计、全屏和主题切换。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <title>随机数罗盘</title>
  <style>
    :root {
      color-scheme: dark;
      --app-height: 100vh;
      --bg: #08111f;
      --panel: rgba(17, 27, 45, 0.82);
      --panel-strong: rgba(29, 43, 66, 0.82);
      --line: rgba(145, 175, 222, 0.26);
      --line-bright: rgba(105, 167, 255, 0.45);
      --text: #f8fbff;
      --muted: #bdd2f4;
      --muted-2: #7f90aa;
      --blue: #3b82f6;
      --blue-soft: #60a5fa;
      --red: #f43f46;
      --green: #22c55e;
      --yellow: #facc15;
      --button-muted: #708096;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    html {
      height: -webkit-fill-available;
    }

    html:fullscreen,
    html:fullscreen body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
    }

    html:fullscreen .app {
      width: 100vw;
      min-height: 100vh;
      border: 0;
      border-radius: 0;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: 20px 14px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(51, 120, 255, 0.2), transparent 34%),
        radial-gradient(circle at 12% 28%, rgba(34, 197, 94, 0.1), transparent 26%),
        linear-gradient(180deg, #0b1424 0%, var(--bg) 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      display: grid;
      place-items: start center;
      overflow-x: hidden;
    }

    body.fullscreen-active {
      padding: 0;
      place-items: stretch;
      width: 100vw;
      width: 100dvw;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.light {
      color-scheme: light;
      --bg: #eef4ff;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(242, 247, 255, 0.9);
      --line: rgba(72, 95, 130, 0.2);
      --line-bright: rgba(18, 104, 238, 0.32);
      --text: #142039;
      --muted: #405473;
      --muted-2: #687895;
      --button-muted: #d8e3f2;
      --shadow: 0 18px 42px rgba(33, 58, 95, 0.1);
      background:
        radial-gradient(circle at 50% 0%, rgba(18, 104, 238, 0.16), transparent 34%),
        radial-gradient(circle at 12% 28%, rgba(34, 197, 94, 0.12), transparent 26%),
        linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    .app {
      width: min(520px, 100%);
      padding: 16px 20px 30px;
      border: 1px solid var(--line-bright);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.06), transparent 32%),
        var(--panel);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
    }

    body.fullscreen-active .app {
      width: 100vw;
      width: 100dvw;
      min-height: 100vh;
      min-height: 100dvh;
      border: 0;
      border-radius: 0;
    }

    body.ios-cover.fullscreen-active {
      position: static;
      width: 100vw;
      width: 100dvw;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body.ios-cover.fullscreen-active .app {
      width: 100vw;
      width: 100dvw;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.ios-cover.fullscreen-active:not(.wechat-browser) .app {
      padding-top: max(18px, env(safe-area-inset-top));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(34px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
    }

    @supports (padding: max(0px)) {
      body.ios-cover:not(.wechat-browser) {
        padding-top: max(20px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }

    body.wechat-browser.fullscreen-active .app {
      display: flex;
      flex-direction: column;
    }

    body.wechat-browser.fullscreen-active .dashboard {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    body.wechat-browser.fullscreen-active .records-field {
      flex: 1;
      min-height: 0;
    }

    body.wechat-browser.fullscreen-active .records-box {
      flex: 1;
      height: auto;
      min-height: 96px;
      max-height: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      min-height: 50px;
    }

    .app-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.85rem, 7vw, 2.55rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 0 14px rgba(96, 165, 250, 0.28);
    }

    .settings-btn {
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--panel-strong);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 10px 22px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .settings-btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-bright);
    }

    .wheel-zone {
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      padding-right: 34px;
    }

    .wheel-wrap {
      position: relative;
      width: min(330px, calc(100vw - 102px));
      aspect-ratio: 1;
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          var(--red) 0deg 90deg,
          var(--blue) 90deg 180deg,
          var(--green) 180deg 270deg,
          var(--yellow) 270deg 360deg
        );
      transform: rotate(0deg);
      transition: transform 3s cubic-bezier(0.14, 0.78, 0.16, 1);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 12px 0 rgba(0, 0, 0, 0.12),
        0 18px 38px rgba(0, 0, 0, 0.32),
        0 0 48px rgba(59, 130, 246, 0.12);
    }

    body.light .wheel {
      box-shadow:
        0 0 0 1px rgba(72, 95, 130, 0.08),
        0 10px 24px rgba(40, 60, 92, 0.14),
        0 18px 42px rgba(40, 60, 92, 0.1);
    }

    .wheel-number {
      position: absolute;
      z-index: 2;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: clamp(2rem, 8vw, 2.75rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 4px 5px 0 rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -50%);
      user-select: none;
    }

    .wheel-number-1 { left: 66%; top: 28%; }
    .wheel-number-2 { left: 72%; top: 66%; }
    .wheel-number-3 { left: 34%; top: 66%; }
    .wheel-number-4 {
      left: 28%;
      top: 28%;
      color: #111827;
      text-shadow: 3px 4px 0 rgba(0, 0, 0, 0.1);
    }

    .hub {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #0d1727;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.03),
        0 8px 24px rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%);
    }

    body.light .hub {
      background: #eef4ff;
    }

    .pointer {
      position: absolute;
      right: -28px;
      top: 50%;
      z-index: 5;
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-right: 42px solid #ffffff;
      transform: translateY(-50%);
      filter: drop-shadow(0 7px 14px rgba(0, 0, 0, 0.24));
    }

    .dashboard {
      display: grid;
      gap: 14px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .field label,
    .records-label {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .control,
    .result-pill,
    .current-result,
    .stat-card,
    .records-box {
      border: 1px solid var(--line);
      background: var(--panel-strong);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 12px 24px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(14px);
    }

    body.light .control,
    body.light .result-pill,
    body.light .current-result,
    body.light .stat-card,
    body.light .records-box {
      box-shadow:
        inset 2px 2px 5px rgba(130, 150, 180, 0.14),
        inset -2px -2px 6px rgba(255, 255, 255, 0.85),
        0 8px 20px rgba(72, 95, 130, 0.08);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      color: var(--text);
      pointer-events: none;
      transform: translateY(-70%) rotate(45deg);
    }

    .control,
    .result-pill {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      color: var(--text);
      outline: none;
    }

    select.control {
      appearance: none;
      padding: 0 42px 0 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .result-pill {
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: var(--text);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      color: #ffffff;
      cursor: pointer;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: 0;
      transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.68;
      transform: none;
    }

    .start-btn {
      min-height: 56px;
      background: linear-gradient(180deg, #69adff, #4f94f7);
      box-shadow:
        0 14px 28px rgba(59, 130, 246, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    body.light .start-btn {
      box-shadow:
        0 10px 22px rgba(59, 130, 246, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .secondary-btn {
      background: linear-gradient(180deg, rgba(133, 151, 174, 0.95), rgba(105, 121, 144, 0.95));
      box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    body.light .secondary-btn {
      color: #10203b;
      background: linear-gradient(180deg, #edf4ff, #dbe7f7);
      box-shadow:
        inset 1px 1px 3px rgba(130, 150, 180, 0.12),
        inset -2px -2px 5px rgba(255, 255, 255, 0.82),
        0 8px 18px rgba(72, 95, 130, 0.08);
    }

    .current-result {
      min-height: 54px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--text);
      font-size: 1.22rem;
      font-weight: 900;
    }

    .current-result strong {
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    body.light .current-result strong {
      color: #142039;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stat-card {
      min-height: 78px;
      padding: 12px 6px;
      display: grid;
      place-items: center;
      gap: 4px;
      border-radius: 14px;
      text-align: center;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .stat-card strong {
      color: #ffffff;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    body.light .stat-card strong {
      color: #142039;
    }

    .records-field {
      display: grid;
      gap: 8px;
    }

    .records-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .records-box {
      width: 100%;
      min-height: 112px;
      max-height: 240px;
      height: 112px;
      padding: 14px;
      overflow: auto;
      resize: vertical;
      border-radius: 14px;
      color: var(--text);
      outline: none;
      font-size: 0.92rem;
      line-height: 1.65;
      font-variant-numeric: tabular-nums;
    }

    .records-box::placeholder {
      color: var(--muted-2);
    }

    .clear-btn {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      background: linear-gradient(180deg, #ff4b52, #ef3840);
      box-shadow:
        0 14px 28px rgba(244, 63, 70, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    body.auth-locked .app,
    body.auth-locked .settings-overlay {
      visibility: hidden;
      pointer-events: none;
      user-select: none;
    }

    .auth-gate,
    .clear-auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 0%, rgba(96, 165, 250, 0.22), transparent 34%),
        rgba(5, 12, 24, 0.92);
    }

    .auth-gate[hidden],
    .clear-auth-overlay[hidden] {
      display: none;
    }

    .full-records-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(2, 8, 18, 0.62);
    }

    .full-records-overlay[hidden] {
      display: none;
    }

    .full-records-card {
      width: min(520px, 100%);
      max-height: min(82vh, 680px);
      display: grid;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line-bright);
      border-radius: 22px;
      color: var(--text);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 34%),
        var(--panel);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(24px);
    }

    .full-records-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .full-records-title {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 900;
    }

    .full-records-close {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: var(--panel-strong);
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
    }

    .full-records-list {
      width: 100%;
      min-height: 260px;
      max-height: 58vh;
      padding: 14px;
      overflow: auto;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--panel-strong);
      outline: none;
      font-size: 0.92rem;
      line-height: 1.7;
      font-variant-numeric: tabular-nums;
    }

    .auth-card,
    .clear-auth-card {
      width: min(430px, 100%);
      display: grid;
      gap: 14px;
      padding: 22px;
      border: 1px solid var(--line-bright);
      border-radius: 22px;
      color: var(--text);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 34%),
        var(--panel);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(24px);
    }

    .auth-title,
    .clear-auth-title {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.2;
      font-weight: 900;
    }

    .auth-subtitle,
    .clear-auth-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .auth-form,
    .clear-auth-form {
      display: grid;
      gap: 12px;
    }

    .auth-field {
      display: grid;
      gap: 6px;
    }

    .auth-field span {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .auth-input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--text);
      background: var(--panel-strong);
      outline: none;
      font: inherit;
      font-weight: 800;
    }

    .auth-input:focus {
      border-color: var(--line-bright);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.16);
    }

    .auth-actions,
    .clear-auth-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .auth-submit,
    .clear-auth-submit,
    .clear-auth-cancel {
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      color: #ffffff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .auth-submit,
    .clear-auth-submit {
      background: linear-gradient(180deg, #69adff, #3b82f6);
    }

    .clear-auth-cancel {
      background: var(--button-muted);
    }

    .auth-message,
    .clear-auth-message {
      min-height: 20px;
      color: #fda4af;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: end center;
      padding: 16px;
      background: rgba(2, 8, 18, 0.56);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .settings-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-sheet {
      width: min(520px, 100%);
      max-height: min(78vh, 620px);
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line-bright);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 34%),
        var(--panel);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(24px);
      transform: translateY(24px);
      transition: transform 0.24s ease;
    }

    .settings-overlay.open .settings-sheet {
      transform: translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sheet-title {
      margin: 0;
      color: var(--text);
      font-size: 1.18rem;
      font-weight: 900;
    }

    .sheet-close {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: var(--panel-strong);
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
    }

    .setting-list {
      display: grid;
      gap: 10px;
    }

    .setting-row {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .setting-action {
      width: 100%;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .setting-copy {
      display: grid;

    .switch {
      position: relative;
      flex: 0 0 54px;
      width: 54px;
      height: 32px;
      display: inline-block;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(112, 128, 150, 0.52);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease;
    }

    .switch input:checked + .switch-track {
      border-color: rgba(96, 165, 250, 0.78);
      background: linear-gradient(180deg, #69adff, #3b82f6);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(22px);
    }

  <script>
    const STORAGE_KEY = "random-wheel-records";
    const FULL_RECORDS_KEY = "random-wheel-full-records";
    const DURATION_KEY = "random-wheel-duration";
    const THEME_KEY = "random-wheel-theme";
    const ROUND_KEY = "random-wheel-round-id";
    const ADMIN_KEY = "random-wheel-admin-account";
    const SESSION_KEY = "random-wheel-auth-session";
    const TOUCH_ENTROPY_LIMIT = 96;

    const authGate = document.getElementById("authGate");
    const authForm = document.getElementById("authForm");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const authUsername = document.getElementById("authUsername");
    const authPassword = document.getElementById("authPassword");
    const authConfirmWrap = document.getElementById("authConfirmWrap");
    const authConfirmPassword = document.getElementById("authConfirmPassword");
    const authSubmit = document.getElementById("authSubmit");
    const authMessage = document.getElementById("authMessage");
    const clearAuthOverlay = document.getElementById("clearAuthOverlay");
    const clearAuthForm = document.getElementById("clearAuthForm");
    const clearAuthUsername = document.getElementById("clearAuthUsername");
    const clearAuthPassword = document.getElementById("clearAuthPassword");
    const clearAuthCancel = document.getElementById("clearAuthCancel");
    const clearAuthMessage = document.getElementById("clearAuthMessage");
    const wheel = document.getElementById("wheel");
    const startBtn = document.getElementById("startBtn");
    const durationSelect = document.getElementById("durationSelect");
    const latestResult = document.getElementById("latestResult");
    const currentResult = document.getElementById("currentResult");
    const clearBtn = document.getElementById("clearBtn");
    const recordsBox = document.getElementById("recordsBox");
    const fullRecordsBtn = document.getElementById("fullRecordsBtn");
    const fullRecordsOverlay = document.getElementById("fullRecordsOverlay");
    const fullRecordsClose = document.getElementById("fullRecordsClose");
    const fullRecordsList = document.getElementById("fullRecordsList");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const settingsClose = document.getElementById("settingsClose");
    const themeSwitch = document.getElementById("themeSwitch");
    const fullscreenSwitch = document.getElementById("fullscreenSwitch");
    const fullscreenNote = document.getElementById("fullscreenNote");
    const landscapeSwitch = document.getElementById("landscapeSwitch");
    const landscapeNote = document.getElementById("landscapeNote");
    const soundSwitch = document.getElementById("soundSwitch");
    const vibrationSwitch = document.getElementById("vibrationSwitch");
    const animationSwitch = document.getElementById("animationSwitch");
    const statEls = {
      1: document.getElementById("stat1"),
      2: document.getElementById("stat2"),
      3: document.getElementById("stat3"),
      4: document.getElementById("stat4")
    };

    let currentRotation = 0;
    let spinning = false;
    let records = loadRecords();
    let fullRecords = loadFullRecords(records);
    let spinDuration = loadDuration();
    let nextRoundId = loadRoundId();
    let pendingDraw = null;
    let touchEntropy = [];
    let clearAuthResolve = null;

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatDateTime(date) {
      return [
        date.getFullYear(),
        "-",
        pad(date.getMonth() + 1),
        "-",
        pad(date.getDate()),
        " ",
        pad(date.getHours()),
        ":",
        pad(date.getMinutes()),
        ":",
        pad(date.getSeconds())
      ].join("");
    }

    async function sha256Text(text) {
      if (!window.crypto?.subtle) {
        throw new Error("当前浏览器不支持 SHA-256，本地登录锁无法使用。");
      }

      const encodedText = new TextEncoder().encode(text);
      const hashBuffer = await window.crypto.subtle.digest("SHA-256", encodedText);
      return bytesToHex(new Uint8Array(hashBuffer));
    }

    function loadAdminAccount() {
      try {
        const rawAdmin = localStorage.getItem(ADMIN_KEY);
        const admin = rawAdmin ? JSON.parse(rawAdmin) : null;
        return admin && admin.username && admin.passwordHash ? admin : null;
      } catch (error) {
        return null;
      }
    }

    function saveAdminAccount(username, passwordHash) {
      localStorage.setItem(ADMIN_KEY, JSON.stringify({
        username,
        passwordHash,
        createdAt: formatDateTime(new Date())
      }));
    }

    function isAuthenticated() {
      return sessionStorage.getItem(SESSION_KEY) === "unlocked";
    }

    function unlockApp() {
      sessionStorage.setItem(SESSION_KEY, "unlocked");
      document.body.classList.remove("auth-locked");
      authGate.hidden = true;
    }

    function lockApp() {
      sessionStorage.removeItem(SESSION_KEY);
      document.body.classList.add("auth-locked");
      authGate.hidden = false;
    }

    function showRegisterMode() {
      lockApp();
      authTitle.textContent = "创建管理员账号";
      authSubtitle.textContent = "首次启动需要创建本地管理员账号，密码只保存 SHA-256 哈希。";
      authConfirmWrap.hidden = false;
      authConfirmPassword.required = true;
      authPassword.autocomplete = "new-password";
      authSubmit.textContent = "创建账号";
      authMessage.textContent = "";
      authForm.dataset.mode = "register";
    }

    function showLoginMode(message = "") {
      lockApp();
      authTitle.textContent = "管理员登录";
      authSubtitle.textContent = "请输入管理员账号和密码后进入罗盘。";
      authConfirmWrap.hidden = true;
      authConfirmPassword.required = false;
      authConfirmPassword.value = "";
      authPassword.autocomplete = "current-password";
      authSubmit.textContent = "登录";
      authMessage.textContent = message;
      authForm.dataset.mode = "login";
    }

    function initializeAuthGate() {
      const admin = loadAdminAccount();

      if (!admin) {
        showRegisterMode();
        return;
      }

      if (isAuthenticated()) {
        unlockApp();
        return;
      }

      showLoginMode();
    }

    async function verifyAdminCredentials(username, password) {
      const admin = loadAdminAccount();
      if (!admin) return false;

      const passwordHash = await sha256Text(password);
      return username === admin.username && passwordHash === admin.passwordHash;
    }

    async function handleRegister() {
      const username = authUsername.value.trim();
      const password = authPassword.value;
      const confirmPassword = authConfirmPassword.value;

      if (!username || !password || !confirmPassword) {
        authMessage.textContent = "请填写账号、密码和确认密码。";
        return;
      }

      if (password !== confirmPassword) {
        authMessage.textContent = "两次输入的密码不一致。";
        return;
      }

      try {
        const passwordHash = await sha256Text(password);
        saveAdminAccount(username, passwordHash);
        authPassword.value = "";
        authConfirmPassword.value = "";
        sessionStorage.removeItem(SESSION_KEY);
        showLoginMode("管理员账号已创建，请登录。");
      } catch (error) {
        authMessage.textContent = error.message || "创建管理员账号失败。";
      }
    }

    async function handleLogin() {
      const username = authUsername.value.trim();
      const password = authPassword.value;

      if (!username || !password) {
        authMessage.textContent = "请输入管理员账号和密码。";
        return;
      }

      try {
        if (await verifyAdminCredentials(username, password)) {
          authPassword.value = "";
          authMessage.textContent = "";
          unlockApp();
          return;
        }

        authMessage.textContent = "账号或密码错误。";
      } catch (error) {
        authMessage.textContent = error.message || "登录验证失败。";
      }
    }

    function requestClearRecordsAuth() {
      return new Promise((resolve) => {
        clearAuthResolve = resolve;
        clearAuthMessage.textContent = "";
        clearAuthUsername.value = "";
        clearAuthPassword.value = "";
        clearAuthOverlay.hidden = false;
        window.setTimeout(() => clearAuthUsername.focus(), 0);
      });
    }

    function closeClearAuth(result) {
      clearAuthOverlay.hidden = true;
      clearAuthUsername.value = "";
      clearAuthPassword.value = "";
      clearAuthMessage.textContent = "";

      if (clearAuthResolve) {
        clearAuthResolve(result);
        clearAuthResolve = null;
      }
    }

    async function handleClearAuthSubmit(event) {
      event.preventDefault();

      try {
        const verified = await verifyAdminCredentials(clearAuthUsername.value.trim(), clearAuthPassword.value);

        if (!verified) {
          clearAuthMessage.textContent = "账号或密码错误，已取消清空。";
          return;
        }

        closeClearAuth(true);
      } catch (error) {
        clearAuthMessage.textContent = error.message || "验证失败。";
      }
    }

    function loadRecords() {
      try {
        const rawRecords = localStorage.getItem(STORAGE_KEY);
        const parsedRecords = rawRecords ? JSON.parse(rawRecords) : [];
        return Array.isArray(parsedRecords) ? parsedRecords : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function loadFullRecords(fallbackRecords = []) {
      try {
        const rawRecords = localStorage.getItem(FULL_RECORDS_KEY);
        const parsedRecords = rawRecords ? JSON.parse(rawRecords) : null;

        if (Array.isArray(parsedRecords)) {
          return parsedRecords;
        }
      } catch (error) {
        // Fall back to the existing simple records if the full history is unavailable.
      }

      return fallbackRecords.map((record) => ({
        roundId: record.roundId || "-",
        number: record.number,
        time: record.time,
        duration: record.duration || loadDuration()
      }));
    }

    function saveFullRecords() {
      localStorage.setItem(FULL_RECORDS_KEY, JSON.stringify(fullRecords));
    }

    function renderFullRecords() {
      fullRecordsList.value = fullRecords
        .map((record) => [
          `第${record.roundId || "-"}局`,
          `结果：${record.number}`,
          `时间：${record.time}`,
          `旋转时长：${record.duration || "-"}秒`
        ].join("\n"))
        .join("\n\n");
      fullRecordsList.scrollTop = 0;
    }

    function openFullRecords() {
      if (!isAuthenticated()) {
        showLoginMode("请先登录后再操作。");
        return;
      }

      closeSettings();
      renderFullRecords();
      fullRecordsOverlay.hidden = false;
    }

    function closeFullRecords() {
      fullRecordsOverlay.hidden = true;
    }

    function loadDuration() {
      const storedDuration = Number(localStorage.getItem(DURATION_KEY));
      return [1, 2, 3, 4, 5, 6, 8].includes(storedDuration) ? storedDuration : 3;
    }

    function loadRoundId() {
      const storedRoundId = Number(localStorage.getItem(ROUND_KEY));
      return Number.isInteger(storedRoundId) && storedRoundId > 0 ? storedRoundId : 1;
    }

    function saveRoundId(roundId) {
      localStorage.setItem(ROUND_KEY, String(roundId));
    }

    function collectTouchEntropy(event) {
      const touches = Array.from(event.changedTouches || []);
      const now = Date.now();
      const perfNow = performance.now();

      touches.forEach((touch) => {
        touchEntropy.push({
          type: event.type,
          x: Number(touch.clientX.toFixed(2)),
          y: Number(touch.clientY.toFixed(2)),
          pageX: Number(touch.pageX.toFixed(2)),
          pageY: Number(touch.pageY.toFixed(2)),
          radiusX: touch.radiusX || 0,
          radiusY: touch.radiusY || 0,
          force: touch.force || 0,
          time: now,
          perf: perfNow
        });
      });

      if (touchEntropy.length > TOUCH_ENTROPY_LIMIT) {
        touchEntropy = touchEntropy.slice(-TOUCH_ENTROPY_LIMIT);
      }
    }

    function generateServerSeed() {
      const bytes = new Uint8Array(32);
      window.crypto.getRandomValues(bytes);
      return bytesToHex(bytes);
    }

    function bytesToHex(bytes) {
      return Array.from(bytes)
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function hashBytesToResult(bytes) {
      let hashValue = 0n;

      bytes.forEach((byte) => {
        hashValue = (hashValue << 8n) + BigInt(byte);
      });

      return Number(hashValue % 4n) + 1;
    }

    async function createLocalDraw() {
      if (!window.crypto?.getRandomValues || !window.crypto?.subtle) {
        throw new Error("当前浏览器不支持本地加密随机数或 SHA-256。");
      }

      const roundId = nextRoundId;
      const serverSeed = generateServerSeed();
      const payload = JSON.stringify({
        roundId,
        serverSeed,
        touchEntropy: touchEntropy.slice(),
        now: Date.now(),
        perf: performance.now()
      });
      const encodedPayload = new TextEncoder().encode(payload);
      const hashBuffer = await window.crypto.subtle.digest("SHA-256", encodedPayload);
      const hashBytes = new Uint8Array(hashBuffer);
      const hash = bytesToHex(hashBytes);
      const result = hashBytesToResult(hashBytes);

      nextRoundId = roundId + 1;
      saveRoundId(nextRoundId);
      touchEntropy = [];

      return {
        roundId,
        serverSeed,
        hash,
        hashBytes,
        result
      };
    }

    function updateDuration(value) {
      spinDuration = Number(value) || 3;
      durationSelect.value = String(spinDuration);
      localStorage.setItem(DURATION_KEY, String(spinDuration));
      wheel.style.transition = `transform ${spinDuration}s cubic-bezier(0.14, 0.78, 0.16, 1)`;
    }

    function getStats() {
      return records.reduce((stats, record) => {
        if (stats[record.number] !== undefined) {
          stats[record.number] += 1;
        }

        return stats;
      }, { 1: 0, 2: 0, 3: 0, 4: 0 });
    }

    function renderRecords() {
      const latest = records[0];
      const stats = getStats();

      latestResult.textContent = latest ? latest.number : "等待开始";
      currentResult.textContent = latest ? latest.number : "-";

      Object.keys(statEls).forEach((number) => {
        statEls[number].textContent = stats[number];
      });

      recordsBox.value = records
        .map((record) => `结果：${record.number}    时间：${record.time}`)
        .join("\n");
      recordsBox.scrollTop = 0;
    }

    function getPointedNumber(rotation) {
      const normalized = ((rotation % 360) + 360) % 360;
      const pointerAngleOnWheel = (90 - normalized + 360) % 360;

      if (pointerAngleOnWheel >= 0 && pointerAngleOnWheel < 90) return 1;
      if (pointerAngleOnWheel >= 90 && pointerAngleOnWheel < 180) return 2;
      if (pointerAngleOnWheel >= 180 && pointerAngleOnWheel < 270) return 3;
      return 4;
    }

    function addRecord(draw) {
      const number = typeof draw === "number" ? draw : draw.result;
      const time = formatDateTime(new Date());
      const roundId = typeof draw === "number" ? undefined : draw.roundId;
      const record = {
        number,
        time,
        duration: spinDuration,
        roundId,
        hash: typeof draw === "number" ? undefined : draw.hash
      };

      records.unshift(record);
      fullRecords.unshift({
        roundId: roundId || "-",
        number,
        time,
        duration: spinDuration
      });
      saveRecords();
      saveFullRecords();
      renderRecords();
      renderFullRecords();
    }

    function setBusy(isBusy) {
      spinning = isBusy;
      startBtn.disabled = isBusy;
      durationSelect.disabled = isBusy;
      startBtn.textContent = isBusy ? "旋转中" : "开始旋转";
    }

    async function spin() {
      if (spinning) return;
      if (!isAuthenticated()) {
        showLoginMode("请先登录后再操作。");
        return;
      }

      setBusy(true);
      updateDuration(spinDuration);

      try {
        pendingDraw = await createLocalDraw();
      } catch (error) {
        setBusy(false);
        alert(error.message || "当前浏览器无法生成开奖结果。");
        return;
      }

      const targetAngles = { 1: 45, 2: 315, 3: 225, 4: 135 };
      const offsetInsideQuarter = (pendingDraw.hashBytes[0] / 255) * 56 - 28;
      const desiredRotation = targetAngles[pendingDraw.result] + offsetInsideQuarter;
      const normalizedRotation = ((currentRotation % 360) + 360) % 360;
      const correction = ((desiredRotation - normalizedRotation) + 360) % 360;
      const fullTurns = 5 + (pendingDraw.hashBytes[1] % 4);

      currentRotation += fullTurns * 360 + correction;
      wheel.style.transform = `rotate(${currentRotation}deg)`;
    }

    function clearRecordsDirect() {
      records = [];
      fullRecords = [];
      saveRecords();
      saveFullRecords();
      renderRecords();
      renderFullRecords();
    }

    async function clearRecords() {
      if (!isAuthenticated()) {
        showLoginMode("请先登录后再操作。");
        return;
      }

      const verified = await requestClearRecordsAuth();
      if (!verified) return;

      if (confirm("确认清空所有结果记录吗？此操作无法撤销。")) {
        clearRecordsDirect();
      }
    }

    function openSettings() {
      if (!isAuthenticated()) {
        showLoginMode("请先登录后再操作。");
        return;
      }

      settingsOverlay.classList.add("open");
      settingsOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeSettings() {
      settingsOverlay.classList.remove("open");
      settingsOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function applyTheme(theme) {
      const isLight = theme === "light";
      document.body.classList.toggle("light", isLight);
      themeSwitch.checked = !isLight;
      localStorage.setItem(THEME_KEY, isLight ? "light" : "dark");
    }

    function toggleTheme() {
      applyTheme(themeSwitch.checked ? "dark" : "light");
    }

    function isIosBrowser() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function applyPlatformClasses() {
      document.body.classList.toggle("ios-cover", isIosBrowser());
      document.body.classList.toggle("wechat-browser", /MicroMessenger/.test(navigator.userAgent));
      document.body.classList.toggle("chrome-browser", /Chrome|CriOS/.test(navigator.userAgent) && !/MicroMessenger/.test(navigator.userAgent));
    }

    function updateViewportHeight() {
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-height", `${height}px`);
    }

    function isStandaloneMode() {
      return window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;
    }

    function updateFullscreenText() {
      document.body.classList.toggle("fullscreen-active", Boolean(document.fullscreenElement) || isStandaloneMode());

      if (isIosBrowser() && !isStandaloneMode() && !document.fullscreenEnabled) {
        fullscreenSwitch.checked = false;
        fullscreenNote.textContent = "请添加到主屏幕后使用";
        return;
      }

      if (isStandaloneMode()) {
        fullscreenSwitch.checked = true;
        fullscreenNote.textContent = "已通过主屏幕全屏打开";
        return;
      }

      fullscreenSwitch.checked = Boolean(document.fullscreenElement);
      fullscreenNote.textContent = document.fullscreenElement ? "已全屏，旋转手机可切换横屏" : "隐藏浏览器界面，不强制横屏";
    }

    function updateLandscapeText() {
      if (isIosBrowser()) {
        landscapeNote.textContent = "苹果手机请直接旋转设备";
        landscapeSwitch.checked = false;
        return;
      }

      landscapeNote.textContent = landscapeSwitch.checked ? "已尝试锁定横屏" : "安卓可尝试锁定横屏";
    }

    async function lockLandscapeIfSupported() {
      if (isIosBrowser()) {
        landscapeNote.textContent = "苹果手机请直接旋转设备";
        landscapeSwitch.checked = false;
        return;
      }

      if (!screen.orientation || !screen.orientation.lock) {
        landscapeNote.textContent = "当前浏览器不支持自动横屏";
        landscapeSwitch.checked = false;
        return;
      }

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
        await screen.orientation.lock("landscape");
        landscapeNote.textContent = "横屏已锁定";
        fullscreenSwitch.checked = true;
        updateFullscreenText();
      } catch (error) {
        landscapeNote.textContent = "请打开系统自动旋转或用 Chrome 测试";
        landscapeSwitch.checked = false;
      }
    }

    function unlockOrientationIfSupported() {
      if (screen.orientation && screen.orientation.unlock) {
        try {
          screen.orientation.unlock();
        } catch (error) {
          // Some in-app browsers expose the API but block unlock.
        }
      }
    }

    async function toggleLandscape() {
      if (landscapeSwitch.checked) {
        await lockLandscapeIfSupported();
      } else {
        unlockOrientationIfSupported();
        landscapeNote.textContent = "安卓可尝试锁定横屏";
      }
    }

    async function toggleFullscreen() {
      if (isIosBrowser() && !isStandaloneMode() && !document.fullscreenEnabled) {
        alert("iPhone Safari 不支持网页按钮直接隐藏地址栏和底部工具栏。请点击 Safari 底部分享按钮，然后选择“添加到主屏幕”，再从桌面图标打开。");
        fullscreenSwitch.checked = false;
        return;
      }

      if (isStandaloneMode()) {
        fullscreenSwitch.checked = true;
        return;
      }

      try {
        if (fullscreenSwitch.checked) {
          await document.documentElement.requestFullscreen();
        } else if (document.fullscreenElement) {
          unlockOrientationIfSupported();
          await document.exitFullscreen();
        }
      } catch (error) {
        fullscreenNote.textContent = "当前浏览器无法全屏";
        fullscreenSwitch.checked = Boolean(document.fullscreenElement);
        window.setTimeout(updateFullscreenText, 1200);
      }
    }

    wheel.addEventListener("transitionend", (event) => {
      if (event.propertyName !== "transform" || !spinning) return;

      addRecord(pendingDraw || getPointedNumber(currentRotation));
      pendingDraw = null;
      setBusy(false);
    });

    document.addEventListener("touchstart", collectTouchEntropy, { passive: true });
    document.addEventListener("touchmove", collectTouchEntropy, { passive: true });
    document.addEventListener("touchend", collectTouchEntropy, { passive: true });
    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (authForm.dataset.mode === "register") {
        await handleRegister();
      } else {
        await handleLogin();
      }
    });
    clearAuthForm.addEventListener("submit", handleClearAuthSubmit);
    clearAuthCancel.addEventListener("click", () => closeClearAuth(false));
    fullRecordsBtn.addEventListener("click", openFullRecords);
    fullRecordsClose.addEventListener("click", closeFullRecords);
    fullRecordsOverlay.addEventListener("click", (event) => {
      if (event.target === fullRecordsOverlay) closeFullRecords();
    });
    startBtn.addEventListener("click", spin);
    clearBtn.addEventListener("click", clearRecords);
    durationSelect.addEventListener("change", (event) => updateDuration(event.target.value));
    settingsBtn.addEventListener("click", openSettings);
    settingsClose.addEventListener("click", closeSettings);
    settingsOverlay.addEventListener("click", (event) => {
      if (event.target === settingsOverlay) closeSettings();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeSettings();
      if (event.key === "Escape") closeFullRecords();
    });
    themeSwitch.addEventListener("change", toggleTheme);
    fullscreenSwitch.addEventListener("change", toggleFullscreen);
    landscapeSwitch.addEventListener("change", toggleLandscape);
    soundSwitch.addEventListener("change", () => localStorage.setItem("random-wheel-sound", soundSwitch.checked ? "on" : "off"));
    vibrationSwitch.addEventListener("change", () => localStorage.setItem("random-wheel-vibration", vibrationSwitch.checked ? "on" : "off"));
    animationSwitch.addEventListener("change", () => localStorage.setItem("random-wheel-animation", animationSwitch.checked ? "on" : "off"));
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        unlockOrientationIfSupported();
        landscapeSwitch.checked = false;
        updateLandscapeText();
      }
      updateViewportHeight();
      updateFullscreenText();
    });
    window.addEventListener("resize", updateViewportHeight);
    window.addEventListener("orientationchange", () => window.setTimeout(updateViewportHeight, 250));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateViewportHeight);
    }

    updateDuration(spinDuration);
    applyPlatformClasses();
    updateViewportHeight();
    applyTheme(localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark");
    soundSwitch.checked = localStorage.getItem("random-wheel-sound") === "on";
    vibrationSwitch.checked = localStorage.getItem("random-wheel-vibration") === "on";
    animationSwitch.checked = localStorage.getItem("random-wheel-animation") !== "off";
    updateLandscapeText();
    updateFullscreenText();
    renderRecords();
    renderFullRecords();
    initializeAuthGate();

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
