<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机数罗盘工具</title>
  <style>
    :root {
      --text: #17213a;
      --soft-text: #52617c;
      --line: #dce3ee;
      --blue: #1268ee;
      --red: #ff252b;
      --green: #18b563;
      --yellow: #ffb800;
      --surface: #ffffff;
      --page: #f5f8fd;
      --shadow: 0 18px 48px rgba(20, 35, 62, 0.13);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 8px;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 15%, rgba(226, 238, 255, 0.7), transparent 28%),
        radial-gradient(circle at 85% 82%, rgba(235, 244, 255, 0.72), transparent 32%),
        var(--page);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    body.dark {
      --text: #eef4ff;
      --soft-text: #aebbd0;
      --line: #334158;
      --surface: #111a2b;
      --page: #0a1020;
      background:
        radial-gradient(circle at 18% 15%, rgba(18, 104, 238, 0.22), transparent 30%),
        radial-gradient(circle at 84% 80%, rgba(24, 181, 99, 0.14), transparent 33%),
        #080d18;
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      width: min(1870px, 100%);
      min-height: calc(100vh - 16px);
      margin: 0 auto;
      padding: clamp(28px, 4vw, 74px) clamp(26px, 5vw, 100px);
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(460px, 720px);
      gap: clamp(48px, 8vw, 145px);
      align-items: start;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid rgba(186, 198, 214, 0.72);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      gap: 22px;
      align-items: flex-start;
      margin-bottom: 34px;
    }

    .brand-mark {
      position: relative;
      flex: 0 0 70px;
      width: 70px;
      height: 70px;
      border: 7px solid var(--blue);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(18, 104, 238, 0.16);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-origin: center;
    }

    .brand-mark::before {
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 31px solid var(--red);
      transform: translate(-38%, -70%) rotate(42deg);
    }

    .brand-mark::after {
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 31px solid var(--blue);
      transform: translate(-62%, -30%) rotate(42deg);
    }

    h1 {
      margin: 0;
      color: #121a33;
      font-size: clamp(2.55rem, 4.2vw, 4.05rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 20px 0 0;
      color: #53627d;
      font-size: clamp(1rem, 1.55vw, 1.42rem);
      line-height: 1.45;
      font-weight: 500;
    }

    .wheel-stage {
      display: grid;
      justify-items: center;
      gap: 26px;
    }

    .wheel-wrap {
      position: relative;
      width: min(630px, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .wheel-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #d9e0eb;
      box-shadow:
        0 16px 35px rgba(20, 35, 62, 0.16),
        inset 0 0 0 8px rgba(255, 255, 255, 0.9);
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      background:
        linear-gradient(rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.03)),
        conic-gradient(
          from 0deg,
          var(--red) 0deg 90deg,
          var(--blue) 90deg 180deg,
          var(--green) 180deg 270deg,
          var(--yellow) 270deg 360deg
        );
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
      transform: rotate(0deg);
      transition: transform 4s cubic-bezier(0.14, 0.78, 0.16, 1);
      z-index: 1;
    }

    .wheel::before,
    .wheel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      background: rgba(255, 255, 255, 0.72);
      transform: translate(-50%, -50%);
    }

    .wheel::before {
      width: 3px;
      height: 100%;
    }

    .wheel::after {
      width: 100%;
      height: 3px;
    }

    .number {
      position: absolute;
      z-index: 3;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: clamp(3.2rem, 6vw, 5.8rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 4px 14px rgba(17, 24, 39, 0.22);
      transform: translate(-50%, -50%);
      user-select: none;
    }

    .number-1 { left: 70%; top: 30%; }
    .number-2 { left: 70%; top: 70%; }
    .number-3 { left: 30%; top: 70%; }
    .number-4 { left: 30%; top: 30%; }

    .hub {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      z-index: 5;
      background: radial-gradient(circle at 34% 28%, #555, #252525 64%, #101010);
      border: 3px solid rgba(17, 24, 39, 0.34);
      box-shadow:
        0 7px 14px rgba(17, 24, 39, 0.32),
        inset 0 4px 10px rgba(255, 255, 255, 0.1);
    }

    .pointer {
      position: absolute;
      right: -32px;
      top: 50%;
      width: 112px;
      height: 40px;
      z-index: 4;
      transform: translateY(-50%);
      filter: drop-shadow(0 8px 11px rgba(183, 20, 24, 0.28));
    }

    .pointer::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 96px;
      height: 20px;
      background: linear-gradient(90deg, #e2141a, #ff2a31);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
      transform: translateY(-50%);
    }

    .pointer::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff353a, #e60009);
      transform: translateY(-50%);
    }

    .right-pane {
      padding-top: 35px;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 190px;
      gap: 56px;
      margin-bottom: 30px;
    }

    .primary-btn,
    .reset-btn,
    .clear-btn,
    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .primary-btn {
      min-height: 78px;
      color: #ffffff;
      background: linear-gradient(180deg, #1d7cff, #0960de);
      box-shadow: 0 10px 24px rgba(9, 96, 222, 0.28);
      font-size: clamp(1.35rem, 2vw, 2rem);
    }

    .primary-btn:hover,
    .reset-btn:hover,
    .clear-btn:hover,
    .tool-btn:hover {
      transform: translateY(-1px);
    }

    .primary-btn:disabled,
    .reset-btn:disabled,
    .duration-slider:disabled {
      cursor: wait;
      opacity: 0.62;
      transform: none;
    }

    .play-icon {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      flex: 0 0 44px;
    }

    .play-icon::before {
      content: "";
      position: absolute;
      left: 17px;
      top: 12px;
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 15px solid var(--blue);
    }

    .reset-btn {
      min-height: 78px;
      color: var(--text);
      background: #ffffff;
      border: 1px solid #d7dee9;
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.05);
      font-size: clamp(1.12rem, 1.55vw, 1.62rem);
    }

    .reset-icon {
      width: 29px;
      height: 29px;
      border: 4px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      position: relative;
      flex: 0 0 29px;
    }

    .reset-icon::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -8px;
      width: 0;
      height: 0;
      border-left: 9px solid currentColor;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      transform: rotate(-28deg);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) 160px 160px;
      gap: 14px;
      margin-bottom: 18px;
    }

    .setting-card,
    .tool-btn {
      min-height: 70px;
      padding: 14px 16px;
      border: 1px solid #d7dee9;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.05);
    }

    .setting-card {
      display: grid;
      gap: 8px;
    }

    .setting-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-weight: 900;
    }

    .duration-value {
      color: var(--blue);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .duration-slider {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .tool-btn {
      color: var(--text);
      font-size: 1rem;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.05);
    }

    .records-card {
      min-height: 650px;
      padding: 26px 24px;
      border: 1px solid #dde4ee;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 30px rgba(20, 35, 62, 0.1);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-item {
      min-height: 82px;
      padding: 14px;
      border: 1px solid #dce3ed;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 16px rgba(17, 24, 39, 0.04);
    }

    .stat-label {
      margin-bottom: 6px;
      color: #53617d;
      font-size: 0.92rem;
      font-weight: 800;
    }

    .stat-count {
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .records-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .records-title {
      margin: 0;
      font-size: clamp(1.15rem, 1.55vw, 1.55rem);
      font-weight: 900;
    }

    .records-tools {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #53617d;
      font-size: clamp(0.9rem, 1.1vw, 1.12rem);
      white-space: nowrap;
    }

    .clear-btn {
      gap: 8px;
      min-height: 30px;
      padding: 0;
      color: var(--red);
      background: transparent;
      box-shadow: none;
      font-size: inherit;
    }

    .records-list {
      height: min(66vh, 910px);
      min-height: 500px;
      overflow-y: auto;
      padding: 0 22px 0 14px;
      border: 1px solid #dce3ed;
      border-radius: 10px;
      background: #ffffff;
      scrollbar-color: #8c8f95 transparent;
      scrollbar-width: thin;
    }

    .record-row {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) auto;
      gap: 20px;
      align-items: center;
      min-height: 92px;
      border-bottom: 1px dashed #d7dfe9;
      color: #17213a;
      font-size: clamp(1rem, 1.25vw, 1.25rem);
    }

    .record-row:last-child {
      border-bottom: 0;
    }

    .record-result {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-weight: 900;
    }

    .record-number {
      font-size: 2em;
      line-height: 1;
      font-weight: 900;
    }

    .number-red { color: var(--red); }
    .number-blue { color: var(--blue); }
    .number-green { color: var(--green); }
    .number-yellow { color: var(--yellow); }

    .record-time {
      color: #52617d;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .empty-state {
      display: grid;
      min-height: 220px;
      place-items: center;
      color: #7a869d;
      text-align: center;
      font-size: 1.08rem;
    }

    body.dark .app-shell,
    body.dark .records-card,
    body.dark .setting-card,
    body.dark .tool-btn,
    body.dark .reset-btn,
    body.dark .records-list,
    body.dark .stat-item {
      background: rgba(17, 26, 43, 0.94);
      border-color: #334158;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }

    body.dark h1 {
      color: var(--text);
    }

    body.dark .subtitle,
    body.dark .records-tools,
    body.dark .record-time,
    body.dark .stat-label,
    body.dark .empty-state {
      color: var(--soft-text);
    }

    body.dark .wheel-wrap::before {
      background: #111a2b;
      border-color: #334158;
      box-shadow:
        0 16px 35px rgba(0, 0, 0, 0.35),
        inset 0 0 0 8px rgba(255, 255, 255, 0.05);
    }

    body.dark .brand-mark,
    body.dark .play-icon {
      background: #111a2b;
    }

    body.dark .record-row {
      color: var(--text);
      border-bottom-color: #334158;
    }

    @media (max-width: 1180px) {
      .app-shell {
        grid-template-columns: 1fr;
        gap: 34px;
      }

      .right-pane {
        padding-top: 0;
      }

      .wheel-wrap {
        width: min(620px, 92vw);
      }
    }

    @media (max-width: 720px) {
      body { padding: 0; }

      .app-shell {
        min-height: 100vh;
        padding: 24px 16px;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .brand {
        gap: 14px;
        margin-bottom: 26px;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
        border-width: 5px;
      }

      h1 { font-size: 2.15rem; }

      .subtitle {
        margin-top: 10px;
        font-size: 0.98rem;
      }

      .wheel-wrap {
        width: min(440px, calc(100vw - 72px));
        padding: 10px;
      }

      .number {
        width: 56px;
        height: 56px;
        font-size: 2.8rem;
      }

      .hub {
        width: 58px;
        height: 58px;
      }

      .pointer {
        right: -22px;
        width: 78px;
        height: 32px;
      }

      .pointer::before {
        width: 68px;
        height: 15px;
      }

      .pointer::after {
        width: 32px;
        height: 32px;
      }

      .actions,
      .settings-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .primary-btn,
      .reset-btn {
        min-height: 60px;
      }

      .records-card {
        min-height: 0;
        padding: 18px 14px;
      }

      .records-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .records-tools {
        width: 100%;
        justify-content: space-between;
      }

      .records-list {
        height: auto;
        max-height: none;
        min-height: 250px;
        padding: 0 12px;
      }

      .record-row {
        grid-template-columns: 1fr;
        gap: 4px;
        min-height: 88px;
        padding: 12px 0;
      }

      .record-time {
        white-space: normal;
      }
    }

    @media (max-width: 980px) and (orientation: landscape) {
      body { padding: 8px; }

      .app-shell {
        min-height: calc(100vh - 16px);
        padding: 18px;
        grid-template-columns: minmax(320px, 0.92fr) minmax(340px, 1fr);
        gap: 22px;
        border-radius: 14px;
        border: 1px solid rgba(186, 198, 214, 0.72);
      }

      .brand {
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
        border-width: 5px;
      }

      h1 { font-size: 1.9rem; }

      .subtitle {
        margin-top: 7px;
        font-size: 0.92rem;
      }

      .wheel-stage { gap: 14px; }

      .wheel-wrap {
        width: min(360px, 42vw);
        padding: 10px;
      }

      .number {
        width: 54px;
        height: 54px;
        font-size: 2.65rem;
      }

      .hub {
        width: 54px;
        height: 54px;
      }

      .pointer {
        right: -19px;
        width: 72px;
        height: 30px;
      }

      .pointer::before {
        width: 62px;
        height: 14px;
      }

      .pointer::after {
        width: 30px;
        height: 30px;
      }

      .right-pane { padding-top: 0; }

      .actions {
        grid-template-columns: minmax(180px, 1fr) 128px;
        gap: 12px;
        margin-bottom: 12px;
      }

      .settings-grid {
        grid-template-columns: minmax(190px, 1fr) 112px 112px;
        gap: 10px;
        margin-bottom: 12px;
      }

      .setting-card,
      .tool-btn {
        min-height: 50px;
        padding: 9px 10px;
      }

      .setting-card { gap: 4px; }

      .setting-head,
      .tool-btn {
        font-size: 0.86rem;
      }

      .stats-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .stat-item {
        min-height: 58px;
        padding: 9px;
      }

      .stat-label {
        margin-bottom: 4px;
        font-size: 0.76rem;
      }

      .stat-count { font-size: 1.45rem; }

      .primary-btn,
      .reset-btn {
        min-height: 52px;
        font-size: 1.12rem;
      }

      .play-icon {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }

      .play-icon::before {
        left: 13px;
        top: 9px;
        border-top-width: 7px;
        border-bottom-width: 7px;
        border-left-width: 11px;
      }

      .reset-icon {
        width: 22px;
        height: 22px;
        flex-basis: 22px;
        border-width: 3px;
      }

      .records-card {
        min-height: 0;
        padding: 14px;
      }

      .records-head {
        flex-direction: row;
        align-items: center;
        margin-bottom: 12px;
      }

      .records-title { font-size: 1.08rem; }

      .records-tools {
        width: auto;
        gap: 14px;
        font-size: 0.86rem;
      }

      .records-list {
        height: clamp(130px, calc(100vh - 300px), 420px);
        min-height: 130px;
        max-height: none;
        padding: 0 14px 0 10px;
      }

      .record-row {
        grid-template-columns: minmax(92px, 1fr) auto;
        gap: 10px;
        min-height: 62px;
        padding: 8px 0;
        font-size: 0.9rem;
      }

      .record-number { font-size: 1.75em; }

      .record-time { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="left-pane" aria-label="随机数罗盘">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>随机数罗盘工具</h1>
          <p class="subtitle">点击开始，罗盘转动，随机结果显示在右侧输入框中。</p>
        </div>
      </header>

      <div class="wheel-stage">
        <div class="wheel-wrap">
          <div class="wheel" id="wheel" aria-label="随机数罗盘">
            <span class="number number-1">1</span>
            <span class="number number-2">2</span>
            <span class="number number-3">3</span>
            <span class="number number-4">4</span>
          </div>
          <div class="hub" aria-hidden="true"></div>
          <div class="pointer" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="right-pane" aria-label="操作与结果记录">
      <div class="actions">
        <button class="primary-btn" id="startBtn" type="button">
          <span class="play-icon" aria-hidden="true"></span>
          <span id="startText">开始</span>
        </button>
        <button class="reset-btn" id="resetBtn" type="button">
          <span class="reset-icon" aria-hidden="true"></span>
          重置
        </button>
      </div>

      <div class="settings-grid" aria-label="功能设置">
        <label class="setting-card" for="durationInput">
          <span class="setting-head">
            <span>旋转时长</span>
            <output class="duration-value" id="durationValue" for="durationInput">4 秒</output>
          </span>
          <input class="duration-slider" id="durationInput" type="range" min="1" max="8" step="0.5" value="4">
        </label>
        <button class="tool-btn" id="themeBtn" type="button">深色模式</button>
        <button class="tool-btn" id="fullscreenBtn" type="button">
          <span id="fullscreenText">全屏模式</span>
        </button>
      </div>

      <div class="records-card">
        <div class="stats-grid" aria-label="数字出现次数统计">
          <div class="stat-item">
            <div class="stat-label">数字 1 次数</div>
            <div class="stat-count number-red" id="stat1">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">数字 2 次数</div>
            <div class="stat-count number-blue" id="stat2">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">数字 3 次数</div>
            <div class="stat-count number-green" id="stat3">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">数字 4 次数</div>
            <div class="stat-count number-yellow" id="stat4">0</div>
          </div>
        </div>

        <div class="records-head">
          <h2 class="records-title">结果记录</h2>
          <div class="records-tools">
            <span id="recordCount">共 0 条记录</span>
            <button class="clear-btn" id="clearBtn" type="button">清空记录</button>
          </div>
        </div>
        <div class="records-list" id="recordsList" role="log" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "random-wheel-records";
    const DURATION_KEY = "random-wheel-duration";
    const THEME_KEY = "random-wheel-theme";
    const wheel = document.getElementById("wheel");
    const startBtn = document.getElementById("startBtn");
    const startText = document.getElementById("startText");
    const resetBtn = document.getElementById("resetBtn");
    const clearBtn = document.getElementById("clearBtn");
    const recordsList = document.getElementById("recordsList");
    const recordCount = document.getElementById("recordCount");
    const durationInput = document.getElementById("durationInput");
    const durationValue = document.getElementById("durationValue");
    const themeBtn = document.getElementById("themeBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const fullscreenText = document.getElementById("fullscreenText");
    const statEls = {
      1: document.getElementById("stat1"),
      2: document.getElementById("stat2"),
      3: document.getElementById("stat3"),
      4: document.getElementById("stat4")
    };

    const colorClassByNumber = {
      1: "number-red",
      2: "number-blue",
      3: "number-green",
      4: "number-yellow"
    };

    let currentRotation = 0;
    let spinning = false;
    let records = loadRecords();
    let spinDuration = loadDuration();

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatDateTime(date) {
      return [
        date.getFullYear(),
        "-",
        pad(date.getMonth() + 1),
        "-",
        pad(date.getDate()),
        " ",
        pad(date.getHours()),
        ":",
        pad(date.getMinutes()),
        ":",
        pad(date.getSeconds())
      ].join("");
    }

    function loadRecords() {
      try {
        const rawRecords = localStorage.getItem(STORAGE_KEY);
        const parsedRecords = rawRecords ? JSON.parse(rawRecords) : [];
        return Array.isArray(parsedRecords) ? parsedRecords : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function loadDuration() {
      const storedDuration = Number(localStorage.getItem(DURATION_KEY));
      if (storedDuration >= 1 && storedDuration <= 8) return storedDuration;
      return 4;
    }

    function setWheelSpinTransition() {
      wheel.style.transition = `transform ${spinDuration}s cubic-bezier(0.14, 0.78, 0.16, 1)`;
    }

    function updateDuration(value) {
      spinDuration = Math.min(8, Math.max(1, Number(value) || 4));
      durationInput.value = spinDuration;
      durationValue.textContent = `${spinDuration.toFixed(spinDuration % 1 === 0 ? 0 : 1)} 秒`;
      localStorage.setItem(DURATION_KEY, String(spinDuration));
      setWheelSpinTransition();
    }

    function getStats() {
      return records.reduce((stats, record) => {
        if (stats[record.number] !== undefined) stats[record.number] += 1;
        return stats;
      }, { 1: 0, 2: 0, 3: 0, 4: 0 });
    }

    function renderStats() {
      const stats = getStats();
      Object.keys(statEls).forEach((number) => {
        statEls[number].textContent = stats[number];
      });
    }

    function renderRecords() {
      recordCount.textContent = `共 ${records.length} 条记录`;
      renderStats();

      if (records.length === 0) {
        recordsList.innerHTML = '<div class="empty-state">暂无记录，点击“开始”生成随机结果。</div>';
        return;
      }

      recordsList.innerHTML = records.map((record) => `
        <div class="record-row">
          <div class="record-result">
            <span>结果：</span>
            <strong class="record-number ${colorClassByNumber[record.number]}">${record.number}</strong>
          </div>
          <div class="record-time">时间： ${record.time}</div>
        </div>
      `).join("");

      recordsList.scrollTop = 0;
    }

    function getPointedNumber(rotation) {
      const normalized = ((rotation % 360) + 360) % 360;
      const pointerAngleOnWheel = (90 - normalized + 360) % 360;

      if (pointerAngleOnWheel >= 0 && pointerAngleOnWheel < 90) return 1;
      if (pointerAngleOnWheel >= 90 && pointerAngleOnWheel < 180) return 2;
      if (pointerAngleOnWheel >= 180 && pointerAngleOnWheel < 270) return 3;
      return 4;
    }

    function addRecord(number) {
      records.unshift({
        number,
        time: formatDateTime(new Date())
      });
      saveRecords();
      renderRecords();
    }

    function setBusy(isBusy) {
      spinning = isBusy;
      startBtn.disabled = isBusy;
      resetBtn.disabled = isBusy;
      durationInput.disabled = isBusy;
      startText.textContent = isBusy ? "转动中" : "开始";
    }

    function spin() {
      if (spinning) return;

      setBusy(true);
      setWheelSpinTransition();

      const targetIndex = Math.floor(Math.random() * 4);
      const targetAngles = [45, 315, 225, 135];
      const offsetInsideQuarter = Math.random() * 58 - 29;
      const desiredRotation = targetAngles[targetIndex] + offsetInsideQuarter;
      const normalizedRotation = ((currentRotation % 360) + 360) % 360;
      const correction = ((desiredRotation - normalizedRotation) + 360) % 360;
      const fullTurns = 6 + Math.floor(Math.random() * 4);

      currentRotation += fullTurns * 360 + correction;
      wheel.style.transform = `rotate(${currentRotation}deg)`;
    }

    function clearRecords() {
      records = [];
      saveRecords();
      renderRecords();
    }

    function resetWheel() {
      if (spinning) return;

      clearRecords();
      currentRotation = 0;
      wheel.style.transition = "transform 0.55s ease";
      wheel.style.transform = "rotate(0deg)";

      window.setTimeout(() => {
        setWheelSpinTransition();
      }, 560);
    }

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark", isDark);
      themeBtn.textContent = isDark ? "浅色模式" : "深色模式";
      localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
    }

    function toggleTheme() {
      applyTheme(document.body.classList.contains("dark") ? "light" : "dark");
    }

    function updateFullscreenText() {
      fullscreenText.textContent = document.fullscreenElement ? "退出全屏" : "全屏模式";
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        fullscreenText.textContent = "无法全屏";
        window.setTimeout(updateFullscreenText, 1300);
      }
    }

    wheel.addEventListener("transitionend", (event) => {
      if (event.propertyName !== "transform" || !spinning) return;

      const number = getPointedNumber(currentRotation);
      addRecord(number);
      setBusy(false);
    });

    startBtn.addEventListener("click", spin);
    clearBtn.addEventListener("click", clearRecords);
    resetBtn.addEventListener("click", resetWheel);
    durationInput.addEventListener("input", (event) => updateDuration(event.target.value));
    themeBtn.addEventListener("click", toggleTheme);
    fullscreenBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenText);

    updateDuration(spinDuration);
    applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");
    updateFullscreenText();
    renderRecords();
  </script>
</body>
</html>
